[package]
name = "storage-insight"
version = "0.1.0"
description = "Storage Insight desktop shell"
authors = ["Storage Insight"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
